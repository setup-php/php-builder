name: Ephemeral PHP build runner
run-name: Managed runner ${{ inputs.pool || 'validation' }}

on:
  push:
    branches: [feature/php-build-runner-pool]
    paths:
      - .github/workflows/managed-runner.yml
      - scripts/managed_*.py
      - scripts/runner_pool.py
      - scripts/prepare-linux-runner.sh
      - scripts/test-runner-compression.sh
      - tests/**
  workflow_dispatch:
    inputs:
      pool:
        description: Prepared environment for ephemeral runners
        type: string
        required: true
      runners:
        description: Optional JSON array of ephemeral runner names
        type: string
        required: false
      image:
        description: Native Linux host matching the registered runner
        type: choice
        required: true
        options:
          - blacksmith-2vcpu-ubuntu-2204
          - blacksmith-2vcpu-ubuntu-2204-arm
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-4vcpu-ubuntu-2404-arm
          - nscloud-ubuntu-22.04-amd64-4x8
          - nscloud-ubuntu-22.04-arm64-4x8
          - nscloud-ubuntu-24.04-amd64-4x8
          - nscloud-ubuntu-24.04-arm64-4x8
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: nscloud-ubuntu-24.04-${{ matrix.arch }}-4x8
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Verify PHP archive compression within the host memory budget
        run: bash scripts/test-runner-compression.sh

  runner:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '[""]') }}
    name: ${{ matrix.runner || inputs.pool }}
    runs-on: ${{ inputs.image }}
    timeout-minutes: 360
    environment: ${{ inputs.pool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install the SQL Server extensions' ODBC runtime
        if: inputs.image == 'nscloud-ubuntu-22.04-amd64-4x8'
        run: |
          if [ ! -e /usr/lib/x86_64-linux-gnu/libodbcinst.so.2 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libodbcinst2
          fi
      - name: Prepare Linux service isolation
        run: bash scripts/prepare-linux-runner.sh
      - name: Serve one PHP build job and retire
        env:
          POOL: ${{ matrix.runner || inputs.pool }}
          RUNNER_REGISTRATION_TOKEN: ${{ secrets.RUNNER_REGISTRATION_TOKEN }}
        run: python scripts/managed_runner.py
